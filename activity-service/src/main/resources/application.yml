server:
  port: 8082

spring:
  application:
    name: activity-service
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/activity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:database}
    password: ${MYSQL_PASSWORD:password1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
    show-sql: true
    open-in-view: false

  jackson:
    time-zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/realms/myRealm/protocol/openid-connect/certs

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  cloud:
    gcp:
      storage:
        enabled: false

  mvc:
    cors:
      allowed-origin-patterns: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

cloudinary:
  cloud-name: dhjamvg6j
  api-key: 237733137343564
  api-secret: ${api_secret:xzojOJkKQH9R6mcX9M8LMPPFlcw}

app:
  services:
    user-service-url: http://localhost:8081
    ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
    ai-connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
    ai-read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:120000}
  certificate:
    allowed-image-hosts: ${CERTIFICATE_ALLOWED_IMAGE_HOSTS:res.cloudinary.com}
    image-max-bytes: ${CERTIFICATE_IMAGE_MAX_BYTES:10485760}
